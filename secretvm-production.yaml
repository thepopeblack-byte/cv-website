services:
  website:
    image: popeblack/cv-website:sha-a40096e
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: "https://formspree.io/f/mbdvyddy"
    networks:
      - popeblack_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=popeblack_web"
      - "traefik.http.routers.popeblack.rule=Host(`popeblack.com`) || Host(`www.popeblack.com`)"
      - "traefik.http.routers.popeblack.entrypoints=websecure"
      - "traefik.http.routers.popeblack.tls=true"
      - "traefik.http.routers.popeblack.tls.certresolver=letsencrypt"
      - "traefik.http.services.popeblack.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=popeblack_web"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=thepopeblack@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "popeblack_letsencrypt:/letsencrypt"
    networks:
      - popeblack_web

networks:
  popeblack_web:
    name: popeblack_web
    driver: bridge

volumes:
  popeblack_letsencrypt: {}
