name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags: "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="sha-$GITHUB_SHA"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set lowercase repository name
        id: set_repo
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        id: build
        env:
          NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
          NEXT_PUBLIC_SUBSTACK_URL: ${{ vars.NEXT_PUBLIC_SUBSTACK_URL }}
          NEXT_PUBLIC_SUBSTACK_EMBED_URL: ${{ vars.NEXT_PUBLIC_SUBSTACK_EMBED_URL }}
        run: |
          for name in NEXT_PUBLIC_CONTACT_FORM_ENDPOINT NEXT_PUBLIC_ANALYTICS_ENABLED NEXT_PUBLIC_SANITY_PROJECT_ID NEXT_PUBLIC_SANITY_DATASET NEXT_PUBLIC_SANITY_API_VERSION NEXT_PUBLIC_SUBSTACK_URL NEXT_PUBLIC_SUBSTACK_EMBED_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing public build variable: $name"
              exit 1
            fi
          done
          if [ "$NEXT_PUBLIC_ANALYTICS_ENABLED" = "true" ] && { [ -z "$NEXT_PUBLIC_GA_MEASUREMENT_ID" ] || [ -z "$NEXT_PUBLIC_CLARITY_PROJECT_ID" ]; }; then
            echo "::error::Analytics is enabled but the existing public provider IDs are missing."
            exit 1
          fi
          docker build --pull \
            --build-arg NEXT_PUBLIC_CONTACT_FORM_ENDPOINT \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID \
            --build-arg NEXT_PUBLIC_CLARITY_PROJECT_ID \
            --build-arg NEXT_PUBLIC_ANALYTICS_ENABLED \
            --build-arg NEXT_PUBLIC_SANITY_PROJECT_ID \
            --build-arg NEXT_PUBLIC_SANITY_DATASET \
            --build-arg NEXT_PUBLIC_SANITY_API_VERSION \
            --build-arg NEXT_PUBLIC_SUBSTACK_URL \
            --build-arg NEXT_PUBLIC_SUBSTACK_EMBED_URL \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:latest \
            -t ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }} \
            -f Dockerfile .

      - name: Verify patched runtime and standalone container
        run: |
          IMAGE="ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}"
          EXPECTED_NODE="v$(tr -d '\r\n' < .nvmrc)"
          ACTUAL_NODE="$(docker run --rm "$IMAGE" node --version)"
          echo "Container Node.js: $ACTUAL_NODE"
          test "$ACTUAL_NODE" = "$EXPECTED_NODE"
          CONTAINER="$(docker run -d -p 127.0.0.1:3000:3000 "$IMAGE")"
          trap 'docker logs "$CONTAINER"; docker rm -f "$CONTAINER" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused --max-time 30 http://127.0.0.1:3000/ > /dev/null
          for path in /blog /impact /expertise /experience /newsletter /studio /sitemap.xml /opengraph-image /kayode-popoola-cv.pdf; do
            curl --fail --silent --show-error --max-time 60 "http://127.0.0.1:3000$path" > /dev/null
          done


      - name: Push Docker image
        id: push
        run: |
          # Publish the checked immutable version before moving latest.
          docker push ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}
          docker push ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:latest

          # Get the manifest digest after pushing
          MANIFEST_DIGEST=$(docker inspect ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:latest --format='{{index .RepoDigests 0}}' | cut -d'@' -f2 | cut -d':' -f2)
          echo "IMAGE_HASH=${MANIFEST_DIGEST}" >> $GITHUB_OUTPUT          

      - name: Generate docker-compose-secretvm.yaml
        run: |
          # Determine the directory where the Dockerfile is located
          DOCKERFILE_DIR="."
          
          # Create the docker-compose file in the same directory as the Dockerfile
          cat > $DOCKERFILE_DIR/docker-compose-secretvm.yaml << EOL
          # Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}
          # Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          # Dockerfile Path: Dockerfile
          # Docker Compose Location: $DOCKERFILE_DIR/docker-compose-secretvm.yaml
          version: '3'
          services:
            app:
              image: ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}@sha256:${{ steps.push.outputs.IMAGE_HASH }}
              ports:
                - '3000'
          EOL

      - name: Commit docker-compose-secretvm.yaml
        run: |
          # Fetch all branches
          git fetch origin
          
          # Get the branch where the tag was created from
          # This is the branch that should receive the docker-compose file
          BRANCH_NAME="main"
          
          # Checkout the branch
          git checkout $BRANCH_NAME
          
          # Configure git
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # Determine the directory where the Dockerfile is located
          DOCKERFILE_DIR="."
          
          # Add and commit changes
          git add $DOCKERFILE_DIR/docker-compose-secretvm.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update docker-compose-secretvm.yaml for version ${{ steps.get_version.outputs.VERSION }}"
            git push origin $BRANCH_NAME
          fi

      - name: Output Image URL
        run: |
          echo "IMAGE_URL=ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "WORKFLOW_ID=${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Notify Workflow Status
        if: always()
        run: |
          echo "Workflow Status: ${{ job.status }}"
          echo "Image URL: ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}"
          echo "Workflow ID: ${{ github.run_id }}"
